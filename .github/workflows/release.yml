name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run Tests
        run: go test ./...

      - name: Build Binary (Linux AMD64)
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o llm-router-mesh-linux-amd64 ./cmd/llm-router-mesh

      - name: Build Binary (Darwin ARM64)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build -ldflags="-s -w" -o llm-router-mesh-darwin-arm64 ./cmd/llm-router-mesh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            llm-router-mesh-linux-amd64
            llm-router-mesh-darwin-arm64
          generate_release_notes: true
